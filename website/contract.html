<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Contracts</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#0a1628,#1a2844);color:#fff;padding:20px}
.header{background:linear-gradient(90deg,#1a2844,#8b6914);padding:15px;border-radius:10px;margin-bottom:20px;display:flex;align-items:center;gap:15px}
.back{font-size:24px;color:#ffd700;text-decoration:none}
h1{color:#ffd700;margin-bottom:20px}
.card{background:rgba(30,58,95,.5);padding:20px;border-radius:15px;margin-bottom:20px;border:1px solid rgba(255,215,0,.3)}
.badge{display:inline-block;background:rgba(16,185,129,.3);padding:8px 15px;border-radius:20px;border:2px solid #10b981;margin:5px;font-size:14px}
.box{background:rgba(0,0,0,.3);padding:15px;border-radius:8px;margin:15px 0;border:2px solid #ffd700}
.addr{color:#10b981;font-family:monospace;word-break:break-all;font-size:13px}
.btn{background:#10b981;color:#fff;border:none;padding:10px 20px;border-radius:8px;margin-top:10px;width:100%;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<a href="index.html" class="back">←</a>
<div style="font-size:20px;font-weight:bold;color:#ffd700">Smart Contracts</div>
</div>

<h1>🔐 Zenith Contract Ecosystem</h1>

<div class="card">
<h2 style="color:#10b981;margin-bottom:15px">🛡️ Military-Grade Security</h2>
<p>Audited by CertiK - Score: 94/100</p>
<div>
<span class="badge">✓ CertiK Audited</span>
<span class="badge">✓ Anti-Whale</span>
<span class="badge">✓ Protected</span>
</div>
</div>

<div class="card">
<h3 style="color:#ffd700;margin-bottom:15px">📜 Main Contract</h3>
<div class="box">
<div style="color:#ffd700;font-size:12px;margin-bottom:5px">Contract Address:</div>
<div class="addr">0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb1</div>
<button class="btn" onclick="copy('0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb1')">📋 Copy</button>
</div>
</div>

<div class="card">
<h3 style="color:#ffd700;margin-bottom:15px">💧 Liquidity Pool</h3>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:15px">
<div style="background:rgba(0,0,0,.3);padding:15px;border-radius:8px;text-align:center">
<div style="font-size:24px;color:#10b981;font-weight:bold">$847K</div>
<div style="font-size:12px;color:#ffd700">Liquidity</div>
</div>
<div style="background:rgba(0,0,0,.3);padding:15px;border-radius:8px;text-align:center">
<div style="font-size:24px;color:#10b981;font-weight:bold">365 Days</div>
<div style="font-size:12px;color:#ffd700">Locked</div>
</div>
</div>
</div>

<script>
function copy(t){navigator.clipboard.writeText(t).then(()=>alert('✅ Copied!'))}
</script>
</body>
</html>
